<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360"><rect width="640" height="360" fill="#0E1A32"/><circle cx="560" cy="40" r="140" fill="#2B447A" opacity=".55"/><rect y="348" width="640" height="12" fill="#FFD23F"/><text x="320" y="80" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="800" fill="#fff" text-anchor="middle" >Is 4572 divisible by 9?</text><text x="320" y="165" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="900" fill="#FFD23F" text-anchor="middle" >4 + 5 + 7 + 2 = 18</text><text x="320" y="240" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle" >18 is a multiple of 9</text><rect x="215" y="262" width="210" height="58" rx="29" fill="#2BA59A"/><text x="320" y="302" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="30" font-weight="900" fill="#fff" text-anchor="middle" >Yes!</text></svg>