<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360"><rect width="640" height="360" fill="#0E1A32"/><circle cx="560" cy="40" r="140" fill="#2B447A" opacity=".55"/><rect y="348" width="640" height="12" fill="#FFD23F"/><text x="320" y="118" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="88" font-weight="900" fill="#FFD23F" text-anchor="middle">37</text><rect x="90" y="150" width="460" height="150" rx="18" fill="#2B447A"/><text x="320" y="196" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="700" fill="#cfd5e3" text-anchor="middle">444 ÷ (4 + 4 + 4) = 37</text><text x="320" y="236" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="700" fill="#cfd5e3" text-anchor="middle">777 ÷ (7 + 7 + 7) = 37</text><text x="320" y="276" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="800" fill="#fff" text-anchor="middle">999 ÷ (9 + 9 + 9) = 37</text><text x="320" y="332" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="700" fill="#FFD23F" text-anchor="middle">because 111 = 3 × 37</text></svg>