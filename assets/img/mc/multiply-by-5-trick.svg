<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360"><rect width="640" height="360" fill="#0E1A32"/><circle cx="560" cy="40" r="140" fill="#2B447A" opacity=".55"/><rect y="348" width="640" height="12" fill="#FFD23F"/><text x="320" y="72" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="40" font-weight="800" fill="#fff" text-anchor="middle">48 × 5</text><text x="320" y="138" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="700" fill="#FFD23F" text-anchor="middle">half of 48 = 24</text><rect x="150" y="165" width="170" height="110" rx="20" fill="#FFD23F"/><text x="235" y="250" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="96" font-weight="900" fill="#0E1A32" text-anchor="middle">24</text><text x="400" y="250" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="96" font-weight="900" fill="#fff" text-anchor="middle">0</text><text x="320" y="324" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="700" fill="#FFD23F" text-anchor="middle">halve it, then add a zero</text></svg>
