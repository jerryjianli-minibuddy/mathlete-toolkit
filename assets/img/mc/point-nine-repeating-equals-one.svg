<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360"><rect width="640" height="360" fill="#0E1A32"/><circle cx="560" cy="40" r="140" fill="#2B447A" opacity=".55"/><rect y="348" width="640" height="12" fill="#FFD23F"/><text x="320" y="130" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="76" font-weight="900" fill="#fff" text-anchor="middle">0.999… <tspan fill="#FFD23F">= 1</tspan></text><rect x="110" y="170" width="420" height="120" rx="18" fill="#2B447A"/><text x="320" y="218" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="30" font-weight="700" fill="#cfd5e3" text-anchor="middle">1/3 = 0.333…</text><text x="320" y="266" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">3 × 1/3 = 0.999… = 1</text><text x="320" y="328" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="700" fill="#FFD23F" text-anchor="middle">same number, two ways to write it</text></svg>
