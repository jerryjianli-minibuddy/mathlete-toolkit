name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 * * * *"   # every hour: new lessons appear once YouTube makes them public
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check which lessons are public and build
        run: python3 build.py --check
      - name: Save the list of public lessons
        run: |
          if ! git diff --quiet data/live.json data/shop.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/live.json data/shop.json
            git commit -m "Update public lessons and checkout"
            git pull --rebase origin main && git push || echo "could not save live.json; the site still deploys"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
